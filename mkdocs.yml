site_name: async-kernel
site_description: Async-kernel for Jupyter
site_author: ""
site_url: https://fleming79.github.io/async-kernel/
repo_name: fleming79/async-kernel
repo_url: https://github.com/fleming79/async-kernel
copyright: "Copyright &copy;   2025-present"
extra:
  version:
    provider: mike
extra_css:
  - stylesheets/extra.css
theme:
  name: material
  custom_dir: docs/overrides
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - content.code.copy
    - toc.follow # https://squidfunk.github.io/mkdocs-material/setup/setting-up-navigation/?h=table#anchor-following
    - toc.integrate # https://squidfunk.github.io/mkdocs-material/setup/setting-up-navigation/?h=table#navigation-integration
    - navigation.top # https://squidfunk.github.io/mkdocs-material/setup/setting-up-navigation/?h=naviga#back-to-top-button
    - header.autohide # https://squidfunk.github.io/mkdocs-material/setup/setting-up-the-header/#automatic-hiding
    - navigation.footer # https://squidfunk.github.io/mkdocs-material/setup/setting-up-the-footer/#navigation
    - search.suggest # https://squidfunk.github.io/mkdocs-material/setup/setting-up-site-search/?h=search#search-suggestions
    - search.highlight # https://squidfunk.github.io/mkdocs-material/setup/setting-up-site-search/?h=search#search-highlighting
    - navigation.instant # https://squidfunk.github.io/mkdocs-material/setup/setting-up-navigation/?h=naviga#instant-loading
  font:
    text: Noto Sans Cham
    code: Noto Sans Mono
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: darkula
      primary: blue
      accent: purple
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: lime
      toggle:
        icon: material/weather-night
        name: Switch to system preference
plugins:
  - search
  - autorefs
  - mkdocs-jupyter:
      include_source: True
  - mkdocstrings:
      enabled: true
      # custom_templates: templates
      default_handler: python
      locale: en
      handlers:
        python:
          paths: [src, docs/snippets]
          inventories:
            - https://docs.python.org/3/objects.inv
          options:
            docstring_options:
              ignore_init_summary: true
            docstring_section_style: list
            extensions: []
            filters: public
            heading_level: 2
            inherited_members: true
            line_length: 120
            merge_init_into_class: true
            parameter_headings: true
            # preload_modules: [mkdocstrings]
            relative_crossrefs: true
            scoped_crossrefs: true
            separate_signature: true
            show_bases: false
            show_inheritance_diagram: true
            show_root_heading: true
            show_root_full_path: true
            show_signature_annotations: true
            show_if_no_docstring: false
            show_root_members_full_path: false
            show_source: true
            show_symbol_type_heading: false
            show_symbol_type_toc: true
            show_category_heading: false
            signature_crossrefs: true
            summary: true
            unwrap_annotated: true

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.snippets
  - pymdownx.superfences
  - footnotes
  - toc:
      permalink: true
      toc_depth: 4
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
nav:
  - Home: index.md
  - Usage:
      - Execute mode: execute_mode.ipynb
      - Caller notebook: caller.ipynb
      - Command line: command_line.md
  - API: api.md
  - Info:
      - Contributing: contributing.md
      - Changelog: changelog.md
      - License: license.md
